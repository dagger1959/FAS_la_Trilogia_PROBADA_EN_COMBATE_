<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuerza Aérea Sur - Trilogía Probada en Combate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        header {
            text-align: center;
            padding: 30px 20px;
            background: #1f1f1f;
            border-bottom: 3px solid #0056b3;
            margin-bottom: 30px;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #b0b0b0;
            font-size: 1.1em;
        }
        .container {
            max-width: 900px;
            margin: auto;
        }
        .section-card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-left: 4px solid #0056b3;
        }
        h2 {
            color: #4dabf7;
            font-size: 1.4em;
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        video, audio {
            width: 100%;
            border-radius: 4px;
            margin-top: 10px;
            background: #000;
        }
        audio {
            height: 40px;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #777;
            font-size: 0.9em;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

        <div class="section-card">

            <audio controls>
